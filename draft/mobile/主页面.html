<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晴好 StillHere - 主页面线框</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 0;
    background: #e8eaed;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .phone-frame {
    width: 390px;
    background: #1a1a1a;
    border: 3px solid #333;
    border-radius: 36px;
    padding: 10px 7px;
  }
  .phone-status-bar {
    width: 375px; height: 24px;
    margin: 0 auto;
    background: #000;
    border-radius: 28px 28px 0 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; position: relative;
  }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; align-items: center; }
  .phone-status-bar::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555;
  }
  .phone-screen {
    width: 375px; height: 780px;
    margin: 0 auto;
    background: #fff;
    border-radius: 0 0 28px 28px;
    overflow-y: auto; overflow-x: hidden;
  }
  .phone-nav-bar {
    width: 375px; height: 8px; margin: 0 auto;
    background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
  }
  .phone-nav-bar::after {
    content: ''; width: 134px; height: 4px;
    background: rgba(255,255,255,0.25); border-radius: 2px;
  }

  /* Draft 规范 */
  .nav-bar {
    height: 48px; border-bottom: 1px solid #e0e0e0;
    display: flex; align-items: center; justify-content: center;
    background: #fff; position: sticky; top: 0; z-index: 1;
  }
  .nav-bar .title { font-size: 17px; font-weight: 600; color: #333; }

  /* 告警横幅 */
  .alert-banner {
    margin: 8px 16px; padding: 12px 16px;
    border: 1px solid #e74c3c; background: #fff;
    display: none; /* 条件显示 */
  }
  .alert-banner.show { display: flex; align-items: center; justify-content: space-between; }
  .alert-banner .text { font-size: 14px; color: #e74c3c; font-weight: 600; }
  .alert-banner .cancel-btn {
    padding: 4px 12px; background: #fff; border: 1px solid #e74c3c;
    color: #e74c3c; font-size: 13px; cursor: pointer;
  }

  /* 卡片 */
  .card {
    margin: 8px 16px; border: 1px solid #e0e0e0;
    padding: 12px 16px; background: #fff;
  }
  .card .card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 6px; }
  .card .card-subtitle { font-size: 13px; color: #666; }
  .card .card-actions { margin-top: 8px; display: flex; gap: 8px; }
  .card .card-actions button {
    padding: 4px 12px; background: #fff; border: 1px solid #333;
    color: #333; font-size: 13px; cursor: pointer;
  }

  /* 时段摘要 */
  .time-section {
    padding: 8px 16px; font-size: 13px; color: #666;
    border-bottom: 1px solid #e0e0e0; font-weight: 600;
  }

  /* 快捷操作 */
  .quick-actions {
    display: flex; gap: 10px; padding: 12px 16px;
  }
  .quick-actions button {
    flex: 1; padding: 10px 0; background: #fff;
    border: 1px solid #333; color: #333; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* 列表标题 */
  .list-header {
    padding: 12px 16px 6px; font-size: 13px; color: #666;
    font-weight: 600;
  }

  /* 返回索引 */
  .back-to-index {
    display: block; text-align: center; padding: 20px 16px;
    font-size: 12px; color: #999; cursor: pointer; text-decoration: none;
    border-top: 1px solid #e0e0e0; margin-top: 16px;
  }

  /* 关心对象卡片 */
  .caring-card {
    margin: 4px 16px; border: 1px solid #e0e0e0; padding: 12px 16px; background: #fff;
  }
  .caring-card .row1 { display: flex; align-items: center; justify-content: space-between; }
  .caring-card .name { font-size: 16px; font-weight: 600; color: #333; }
  .caring-card .status {
    font-size: 12px; color: #666; margin-top: 4px;
  }
  .caring-card .mutual-badge {
    font-size: 11px; color: #333; border: 1px solid #333;
    padding: 1px 6px; margin-left: 4px;
  }
  .caring-card .city { font-size: 12px; color: #999; }
  .caring-card a { font-size: 13px; color: #333; text-decoration: none; cursor: pointer; }

  /* 空状态 */
  .empty { padding: 40px 16px; text-align: center; font-size: 14px; color: #999; }
  .empty .action { color: #333; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-status-bar">
    <span class="time">9:41</span>
    <span class="icons">📶 🔋</span>
  </div>
  <div class="phone-screen">
    <!-- 导航栏 -->
    <div class="nav-bar"><span class="title">晴好</span></div>

    <!-- 告警横幅 -->
    <div class="alert-banner" id="alertBanner">
      <span class="text">🚨 已 30 分钟无活动</span>
      <button class="cancel-btn" onclick="this.parentElement.classList.remove('show')">取消告警</button>
    </div>

    <!-- 关心码卡片 -->
    <div class="card">
      <div class="card-title">我的关心码: A1B2C3</div>
      <div class="card-subtitle">分享给家人，对方输入此码即可添加你为关心对象</div>
      <div class="card-actions">
        <button onclick="alert('查看二维码')">查看二维码</button>
        <button onclick="alert('分享关心码')">分享</button>
      </div>
    </div>

    <!-- 被关心统计 -->
    <div class="card">
      <div class="card-title">有 3 人在关心我</div>
      <div class="card-actions">
        <button onclick="alert('查看关心我的人')">查看详情</button>
      </div>
    </div>

    <!-- 时段摘要 -->
    <div class="time-section">守护时段: 2个时段 · 共9小时</div>

    <!-- 快捷操作 -->
    <div class="quick-actions">
      <button onclick="alert('添加关心')">+ 添加关心</button>
      <button onclick="alert('守护时段配置')">⏰ 守护时段</button>
    </div>

    <!-- 我关心的列表 -->
    <div class="list-header">我关心的 (2人)</div>

    <div class="caring-card">
      <div class="row1">
        <span class="name">妈妈 <span class="mutual-badge">互关</span></span>
        <a href="#" onclick="alert('发送问安')">问安 ></a>
      </div>
      <div class="status">刚刚活跃 🔋</div>
      <div class="city">北京</div>
    </div>

    <div class="caring-card">
      <div class="row1">
        <span class="name">爸爸</span>
        <a href="#" onclick="alert('发送问安')">问安 ></a>
      </div>
      <div class="status">30分钟前活跃 ⚡</div>
      <div class="city">上海</div>
    </div>

    <a class="back-to-index" href="index.html">← 返回场景地图</a>

  </div>
  <div class="phone-nav-bar"></div>
</div>

</body>
</html>
