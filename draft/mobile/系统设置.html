<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 - 晴好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 40px 0; background: #e8eaed; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 390px; background: #1a1a1a; border: 3px solid #333; border-radius: 36px; padding: 10px 7px; }
  .phone-status-bar { width: 375px; height: 24px; margin: 0 auto; background: #000; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; align-items: center; }
  .phone-status-bar::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; }
  .phone-screen { width: 375px; height: 780px; margin: 0 auto; background: #fff; border-radius: 0 0 28px 28px; overflow-y: auto; overflow-x: hidden; }
  .phone-nav-bar { width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .phone-nav-bar::after { content: ''; width: 134px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .nav-bar { height: 48px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; background: #fff; }
  .nav-bar .back { padding: 0 8px 0 4px; font-size: 20px; color: #333; cursor: pointer; border: none; background: none; width: 40px; text-align: center; }
  .nav-bar .title { font-size: 17px; font-weight: 600; color: #333; }
  .section-title { padding: 16px 16px 8px; font-size: 13px; font-weight: 600; color: #666; }
  .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .setting-item .label { font-size: 15px; color: #333; }
  .setting-item .value { font-size: 14px; color: #999; }
  .setting-item .arrow { font-size: 14px; color: #bbb; }
  .toggle { width: 48px; height: 28px; border: 1px solid #333; background: #333; position: relative; cursor: pointer; }
  .toggle::after { content: ''; position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; background: #fff; border: 1px solid #333; }
  .toggle.off { background: #fff; }
  .toggle.off::after { right: auto; left: 2px; }
  .back-to-index { display: block; text-align: center; padding: 20px 16px; font-size: 12px; color: #999; text-decoration: none; border-top: 1px solid #e0e0e0; margin-top: 16px; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-status-bar"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>
  <div class="phone-screen">
    <div class="nav-bar">
      <button class="back" onclick="location.href='index.html'">←</button>
      <span class="title">设置</span>
    </div>

    <div class="section-title">监测</div>
    <div class="setting-item" onclick="this.querySelector('.toggle').classList.toggle('off')">
      <span class="label">定位监测</span>
      <span class="toggle"></span>
    </div>
    <div class="setting-item" onclick="this.querySelector('.toggle').classList.toggle('off')">
      <span class="label">运动监测</span>
      <span class="toggle"></span>
    </div>

    <div class="section-title">告警</div>
    <div class="setting-item" onclick="location.href='守护时段配置.html'">
      <span class="label">守护时段 & 阈值</span>
      <span class="arrow">›</span>
    </div>

    <div class="section-title">关于</div>
    <div class="setting-item">
      <span class="label">版本号</span>
      <span class="value">V1.1.0</span>
    </div>
    <div class="setting-item" onclick="alert('隐私条款')">
      <span class="label">隐私条款</span>
      <span class="arrow">›</span>
    </div>
    <div class="setting-item" onclick="alert('通用设置')">
      <span class="label">通用</span>
      <span class="arrow">›</span>
    </div>

    <a class="back-to-index" href="index.html">← 返回场景地图</a>
  </div>
  <div class="phone-nav-bar"></div>
</div>
</body>
</html>
