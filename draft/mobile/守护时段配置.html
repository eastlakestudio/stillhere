<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守护时段配置 - 晴好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 40px 0; background: #e8eaed; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 390px; background: #1a1a1a; border: 3px solid #333; border-radius: 36px; padding: 10px 7px; }
  .phone-status-bar { width: 375px; height: 24px; margin: 0 auto; background: #000; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; align-items: center; }
  .phone-status-bar::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; }
  .phone-screen { width: 375px; height: 780px; margin: 0 auto; background: #fff; border-radius: 0 0 28px 28px; overflow-y: auto; overflow-x: hidden; }
  .phone-nav-bar { width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .phone-nav-bar::after { content: ''; width: 134px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .nav-bar { height: 48px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; background: #fff; }
  .nav-bar .back { padding: 0 8px 0 4px; font-size: 20px; color: #333; cursor: pointer; border: none; background: none; width: 40px; text-align: center; }
  .nav-bar .title { font-size: 17px; font-weight: 600; color: #333; }
  .card { margin: 8px 16px; border: 1px solid #e0e0e0; padding: 14px 16px; }
  .card .row { display: flex; justify-content: space-between; align-items: center; }
  .card .time-range { font-size: 16px; font-weight: 600; color: #333; }
  .card .hours { font-size: 12px; color: #999; }
  .card .actions { display: flex; gap: 8px; }
  .card .actions button { padding: 4px 10px; background: #fff; border: 1px solid #333; color: #333; font-size: 12px; cursor: pointer; }
  .summary { padding: 8px 16px; font-size: 13px; color: #666; border-bottom: 1px solid #e0e0e0; font-weight: 600; }
  .btn { display: block; width: calc(100% - 32px); margin: 12px 16px; padding: 10px 0; background: #fff; border: 1px solid #333; color: #333; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
  .alert-card { margin: 8px 16px; border: 1px solid #e0e0e0; padding: 14px 16px; }
  .alert-row { display: flex; justify-content: space-between; align-items: center; }
  .alert-label { font-size: 14px; color: #333; }
  .alert-value { font-size: 14px; color: #333; font-weight: 600; }
  .back-to-index { display: block; text-align: center; padding: 20px 16px; font-size: 12px; color: #999; text-decoration: none; border-top: 1px solid #e0e0e0; margin-top: 16px; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-status-bar"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>
  <div class="phone-screen">
    <div class="nav-bar">
      <button class="back" onclick="location.href='index.html'">←</button>
      <span class="title">守护时段配置</span>
    </div>

    <div class="summary">守护时段: 2个时段 · 共 9 小时</div>

    <div class="card">
      <div class="row">
        <div>
          <div class="time-range">09:00 - 18:00</div>
          <div class="hours">9 小时</div>
        </div>
        <div class="actions">
          <button onclick="alert('编辑时段')">编辑</button>
          <button onclick="confirm('删除？')&&alert('已删除')">删除</button>
        </div>
      </div>
    </div>

    <button class="btn" onclick="alert('添加时段')">+ 添加时段</button>

    <div style="padding: 12px 16px; font-size: 14px; font-weight: 600; color: #333; margin-top: 8px;">告警设置</div>

    <div class="alert-card">
      <div class="alert-row">
        <span class="alert-label">静置告警阈值</span>
        <span class="alert-value">30 分钟</span>
      </div>
      <input type="range" min="5" max="120" step="5" value="30" style="width:100%;margin-top:8px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#999;margin-top:2px"><span>5min</span><span>120min</span></div>
    </div>

    <div class="alert-card">
      <div class="alert-row">
        <span class="alert-label">充电时忽略告警</span>
        <input type="checkbox" style="width:20px;height:20px">
      </div>
    </div>

    <a class="back-to-index" href="index.html">← 返回场景地图</a>
  </div>
  <div class="phone-nav-bar"></div>
</div>
</body>
</html>
