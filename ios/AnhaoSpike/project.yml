name: AnhaoSpike
options:
  bundleIdPrefix: com.eastlakestudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "J4RT98GF7B"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  AnhaoSpike:
    type: application
    platform: iOS
    sources:
      - AnhaoSpike
    info:
      path: AnhaoSpike/Info.plist
      properties:
        CFBundleDisplayName: 晴好
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - location
          - motion
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.eastlakestudio.stillhere.refresh
        NSLocationAlwaysAndWhenInUseUsageDescription: "独居安全监测需要定位权限以检测您的活动状态。仅在位置显著变化时唤醒 App 上报，不记录您的具体坐标。"
        NSLocationAlwaysUsageDescription: "独居安全监测需要始终定位权限，以在后台被杀后仍能唤醒 App 上报活动。"
        NSLocationWhenInUseUsageDescription: "独居安全监测需要定位权限以检测您的活动状态。"
        NSMotionUsageDescription: "独居安全监测需要运动权限以检测您的活动状态变化（走路/静止等）。"
        NSCameraUsageDescription: "扫码添加家人时需要相机权限来扫描关心码。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.stillhere
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
