name = "stillhere-api"
main = "src/index.ts"
compatibility_date = "2025-07-22"

# D1 数据库绑定（部署后回填 database_id）
[[d1_databases]]
binding = "DB"
database_name = "stillhere-db"
database_id = "fd0df397-0ccb-4318-95ae-9c5fa85b5fd2"

# 服务端不再主动判超时告警，告警逻辑由客户端本地基于作息时间自行裁决
# 客户端约每小时上报周期心跳，供关心人查看在线状态

# 预留多 Worker 扩展（当前单 Worker）
# [env.production] ...

workers_dev = true

# Cron 触发器：每 5 分钟执行 watchdog 离线检测
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[vars]
APNS_KEY_ID = "K44F55XY24"
APNS_TEAM_ID = "J4RT98GF7B"
APP_BUNDLE_ID = "com.eastlakestudio.stillhere"
