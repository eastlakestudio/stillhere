<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>回复问安 - 晴好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 40px 0; background: linear-gradient(135deg, #e8eaed 0%, #d5d8dc 100%); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 390px; background: #1a1a1a; border: 3px solid #333; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 10px 7px; }
  .phone-status-bar { width: 375px; height: 24px; margin: 0 auto; background: #000; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; }
  .phone-status-bar::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; }
  .phone-screen { width: 375px; height: 780px; margin: 0 auto; background: #FFF8F4; border-radius: 0 0 28px 28px; overflow-y: auto; }
  .phone-nav-bar { width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .phone-nav-bar::after { content: ''; width: 134px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .app-header { height: 56px; background: #FFF8F4; display: flex; align-items: center; padding: 0 12px; }
  .app-header .back { font-size: 20px; color: #1C1B1F; cursor: pointer; border: none; background: none; width: 40px; text-decoration: none; display: flex; align-items: center; justify-content: center; }
  .app-header .title { font-size: 20px; font-weight: 300; letter-spacing: 2px; color: #1C1B1F; }
  .summary { padding: 12px 18px 4px; font-size: 13px; color: #49454F; font-weight: 500; }
  .greeting-card { margin: 10px 16px; padding: 16px; background: #fff; border: 1px solid #E7E0EC; }
  .greeting-card .sender { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .greeting-card .sender .avatar { width: 36px; height: 36px; background: #EADDFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #21005D; font-size: 15px; font-weight: 500; }
  .greeting-card .sender .info { flex: 1; }
  .greeting-card .sender .name { font-size: 15px; font-weight: 500; color: #1C1B1F; }
  .greeting-card .sender .time { font-size: 12px; color: #49454F; }
  .greeting-card .message { font-size: 15px; color: #1C1B1F; padding: 10px 14px; background: #F3EDF7; border-radius: 0 12px 12px 12px; display: inline-block; }
  .greeting-card .reply-section { margin-top: 10px; }
  .quick-reply { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .quick-reply .chip { padding: 5px 12px; font-size: 12px; color: #C25A00; background: #FFF3E8; border: 1px solid #C25A00; cursor: pointer; }
  .quick-reply .chip:hover { background: #FFE0C0; }
  .reply-input { display: flex; gap: 8px; }
  .reply-input input { flex: 1; padding: 8px 12px; font-size: 13px; border: 1px solid #E7E0EC; outline: none; font-family: inherit; color: #1C1B1F; }
  .reply-input input:focus { border-color: #C25A00; }
  .reply-input button { padding: 8px 16px; background: #C25A00; border: none; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  .divider { margin: 4px 16px; border: none; border-top: 1px solid #E7E0EC; }
  .section-title { padding: 14px 18px 6px; font-size: 13px; font-weight: 500; color: #49454F; }
  .custom-reply { margin: 8px 16px; padding: 16px; background: #F3EDF7; }
  .custom-reply .label { font-size: 13px; font-weight: 500; color: #1C1B1F; margin-bottom: 8px; }
  .custom-reply textarea { width: 100%; height: 80px; padding: 10px 14px; font-size: 14px; font-family: inherit; color: #1C1B1F; border: 1px solid #E7E0EC; outline: none; resize: none; background: #fff; }
  .custom-reply textarea:focus { border-color: #C25A00; }
  .custom-reply .send-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .custom-reply .send-row button { padding: 8px 20px; background: #C25A00; border: none; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  .back-link { display: block; text-align: center; padding: 20px 16px; font-size: 12px; color: #999; text-decoration: none; }
</style></head>
<body>
<div class="phone-frame">
  <div class="phone-status-bar"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>
  <div class="phone-screen">
    <div class="app-header"><a class="back" href="index.html">←</a><span class="title">回复问安</span></div>

    <div class="summary">共 2 条待回复问安</div>

    <div class="greeting-card">
      <div class="sender">
        <div class="avatar">爸</div>
        <div class="info">
          <div class="name">爸爸</div>
          <div class="time">5分钟前</div>
        </div>
      </div>
      <div class="message">问安</div>
      <div class="reply-section">
        <div class="quick-reply">
          <span class="chip" onclick="this.parentElement.nextElementSibling.querySelector('input').value='晴好'">晴好</span>
          <span class="chip" onclick="this.parentElement.nextElementSibling.querySelector('input').value='一切安好'">一切安好</span>
          <span class="chip" onclick="this.parentElement.nextElementSibling.querySelector('input').value='收到'">收到</span>
        </div>
        <div class="reply-input">
          <input type="text" placeholder="输入回复...">
          <button onclick="alert('回复已发送')">发送</button>
        </div>
      </div>
    </div>

    <div class="greeting-card">
      <div class="sender">
        <div class="avatar">妈</div>
        <div class="info">
          <div class="name">妈妈</div>
          <div class="time">1小时前</div>
        </div>
      </div>
      <div class="message">最近还好吗？</div>
      <div class="reply-section">
        <div class="quick-reply">
          <span class="chip" onclick="this.parentElement.nextElementSibling.querySelector('input').value='晴好'">晴好</span>
          <span class="chip" onclick="this.parentElement.nextElementSibling.querySelector('input').value='一切安好'">一切安好</span>
          <span class="chip" onclick="this.parentElement.nextElementSibling.querySelector('input').value='收到'">收到</span>
        </div>
        <div class="reply-input">
          <input type="text" placeholder="输入回复...">
          <button onclick="alert('回复已发送')">发送</button>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="custom-reply">
      <div class="label">自定义回复（全部问安）</div>
      <textarea id="customMsg" placeholder="输入回复内容，将发送给所有待回复的问安..."></textarea>
      <div class="send-row"><button onclick="alert('已批量回复')">发送</button></div>
    </div>

    <a class="back-link" href="index.html">← 返回场景地图</a>
  </div>
  <div class="phone-nav-bar"></div>
</div>
</body>
</html>
