<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晴好 StillHere — 移动端高保真原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 0;
    background: linear-gradient(135deg, #e8eaed 0%, #d5d8dc 100%);
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }
  .phone-frame {
    width: 390px;
    background: #1a1a1a;
    border: 3px solid #333;
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 0 10px rgba(255,255,255,0.05);
    padding: 10px 7px;
  }
  .phone-status-bar {
    width: 375px; height: 24px; margin: 0 auto;
    background: #000; border-radius: 28px 28px 0 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; position: relative;
  }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; align-items: center; }
  .phone-status-bar::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555;
  }
  .phone-screen {
    width: 375px; height: 780px; margin: 0 auto;
    background: #FFF8F4; border-radius: 0 0 28px 28px;
    overflow-y: auto; overflow-x: hidden;
  }
  .phone-nav-bar {
    width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
  }
  .phone-nav-bar::after {
    content: ''; width: 134px; height: 4px;
    background: rgba(255,255,255,0.25); border-radius: 2px;
  }

  /* App 内样式 */
  .app-header {
    height: 48px; background: #FFF8F4;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 0.5px solid #e0d6cf;
    position: sticky; top: 0; z-index: 10;
  }
  .app-header .title { font-size: 17px; font-weight: 300; letter-spacing: 2px; color: #333; }
  .scene-group { padding: 0; margin: 0; }
  .scene-group-title {
    font-size: 12px; font-weight: 600; color: #999;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 14px 18px 6px;
  }
  .scene-item {
    display: flex; align-items: center; padding: 14px 18px;
    border-bottom: 0.5px solid #f0ebe4; cursor: pointer;
    transition: background 0.15s;
  }
  .scene-item:hover { background: #FDF6F0; }
  .scene-item .icon { font-size: 18px; margin-right: 12px; }
  .scene-item .label { font-size: 15px; color: #333; flex: 1; }
  .scene-item .tag {
    font-size: 11px; color: #C25A00; background: #FFF3E8;
    border: 0.5px solid #F0D5BE; padding: 2px 8px; margin-right: 8px;
  }
  .scene-item .arrow { color: #ccc; font-size: 16px; }
  .scene-item.done .label { color: #333; }
  .scene-item.pending .label { color: #999; }
  .footer {
    padding: 24px 16px; text-align: center;
    font-size: 12px; color: #bbb; border-top: 0.5px solid #f0ebe4;
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-status-bar">
    <span class="time">9:41</span>
    <span class="icons">📶 🔋</span>
  </div>
  <div class="phone-screen" id="app">
    <div class="app-header">
      <span class="title">晴好</span>
    </div>

    <div class="scene-group">
      <div class="scene-group-title">核心场景</div>
      <div class="scene-item done" onclick="location.href='主页面.html'">
        <span class="icon">🏠</span><span class="label">主页面</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='我的关心码.html'">
        <span class="icon">📱</span><span class="label">我的关心码</span><span class="tag">QR</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='添加关心.html'">
        <span class="icon">➕</span><span class="label">添加关心</span><span class="tag">扫码</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='关心对象详情.html'">
        <span class="icon">👤</span><span class="label">关心对象详情</span><span class="arrow">›</span>
      </div>
    </div>

    <div class="scene-group">
      <div class="scene-group-title">告警与问安</div>
      <div class="scene-item done" onclick="location.href='告警横幅.html'">
        <span class="icon">🚨</span><span class="label">告警横幅 & 倒计时</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='收到告警通知.html'">
        <span class="icon">🔔</span><span class="label">收到告警通知</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='发送问安.html'">
        <span class="icon">💬</span><span class="label">发送问安</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='回复问安.html'">
        <span class="icon">✉️</span><span class="label">回复问安</span><span class="arrow">›</span>
      </div>
    </div>

    <div class="scene-group">
      <div class="scene-group-title">设置与配置</div>
      <div class="scene-item done" onclick="location.href='守护时段配置.html'">
        <span class="icon">⏰</span><span class="label">守护时段配置</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='系统设置.html'">
        <span class="icon">⚙️</span><span class="label">系统设置</span><span class="arrow">›</span>
      </div>
    </div>

    <div class="scene-group">
      <div class="scene-group-title">被关心视角</div>
      <div class="scene-item done" onclick="location.href='谁在关心我.html'">
        <span class="icon">👥</span><span class="label">谁在关心我</span><span class="arrow">›</span>
      </div>
      <div class="scene-item done" onclick="location.href='来自关心人的问安.html'">
        <span class="icon">💌</span><span class="label">来自关心人的问安</span><span class="arrow">›</span>
      </div>
    </div>

    <div class="footer">晴好 StillHere · UED 高保真原型</div>
  </div>
  <div class="phone-nav-bar"></div>
</div>

</body>
</html>
