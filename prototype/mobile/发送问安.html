<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>发送问安 - 晴好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 40px 0; background: linear-gradient(135deg, #e8eaed 0%, #d5d8dc 100%); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 390px; background: #1a1a1a; border: 3px solid #333; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 10px 7px; }
  .phone-status-bar { width: 375px; height: 24px; margin: 0 auto; background: #000; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; }
  .phone-status-bar::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; }
  .phone-screen { width: 375px; height: 780px; margin: 0 auto; background: #FFF8F4; border-radius: 0 0 28px 28px; overflow-y: auto; }
  .phone-nav-bar { width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .phone-nav-bar::after { content: ''; width: 134px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .app-header { height: 56px; background: #FFF8F4; display: flex; align-items: center; padding: 0 12px; }
  .app-header .back { font-size: 20px; color: #1C1B1F; cursor: pointer; border: none; background: none; width: 40px; text-decoration: none; display: flex; align-items: center; justify-content: center; }
  .app-header .title { font-size: 20px; font-weight: 300; letter-spacing: 2px; color: #1C1B1F; }
  .recipient-card { margin: 12px 16px; background: #F3EDF7; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .recipient-card .avatar { width: 48px; height: 48px; background: #C25A00; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 500; }
  .recipient-card .info { flex: 1; }
  .recipient-card .name { font-size: 16px; font-weight: 500; color: #1C1B1F; }
  .recipient-card .code { font-size: 13px; color: #49454F; font-family: monospace; letter-spacing: 2px; margin-top: 2px; }
  .section-title { padding: 14px 18px 6px; font-size: 13px; font-weight: 500; color: #49454F; }
  .message-area { margin: 8px 16px; }
  .message-area textarea { width: 100%; height: 160px; padding: 14px; font-size: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1C1B1F; background: #fff; border: 1px solid #E7E0EC; resize: none; outline: none; }
  .message-area textarea:focus { border-color: #C25A00; }
  .hint { margin: 6px 18px; font-size: 12px; color: #49454F; line-height: 1.5; }
  .btn { display: block; width: calc(100% - 32px); margin: 16px 16px; padding: 14px 0; background: #C25A00; border: none; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; }
  .btn:active { opacity: 0.85; }
  .quick-messages { padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .quick-messages .chip { padding: 6px 14px; font-size: 12px; color: #C25A00; background: #FFF3E8; border: 1px solid #C25A00; cursor: pointer; }
  .back-link { display: block; text-align: center; padding: 20px 16px; font-size: 12px; color: #999; text-decoration: none; }
</style></head>
<body>
<div class="phone-frame">
  <div class="phone-status-bar"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>
  <div class="phone-screen">
    <div class="app-header"><a class="back" href="index.html">←</a><span class="title">发送问安</span></div>

    <div class="recipient-card">
      <div class="avatar">妈</div>
      <div class="info">
        <div class="name">妈妈</div>
        <div class="code">B5A218</div>
      </div>
    </div>

    <div class="section-title">快捷消息</div>
    <div class="quick-messages">
      <span class="chip" onclick="document.getElementById('msg').value='问安'">问安</span>
      <span class="chip" onclick="document.getElementById('msg').value='最近还好吗？'">最近还好吗？</span>
      <span class="chip" onclick="document.getElementById('msg').value='今天天气不错'">今天天气不错</span>
      <span class="chip" onclick="document.getElementById('msg').value='一切都好吗？'">一切都好吗？</span>
    </div>

    <div class="section-title">消息内容</div>
    <div class="message-area">
      <textarea id="msg" placeholder="输入想问安的内容...">问安</textarea>
    </div>

    <div class="hint">💡 消息将通过服务端推送给对方</div>

    <button class="btn" onclick="alert('问安已发送')">发送问安</button>

    <a class="back-link" href="index.html">← 返回场景地图</a>
  </div>
  <div class="phone-nav-bar"></div>
</div>
</body>
</html>
