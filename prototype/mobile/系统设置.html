<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>系统设置 - 晴好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 40px 0; background: linear-gradient(135deg, #e8eaed 0%, #d5d8dc 100%); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 390px; background: #1a1a1a; border: 3px solid #333; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 10px 7px; }
  .phone-status-bar { width: 375px; height: 24px; margin: 0 auto; background: #000; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; }
  .phone-status-bar::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; }
  .phone-screen { width: 375px; height: 780px; margin: 0 auto; background: #FFF8F4; border-radius: 0 0 28px 28px; overflow-y: auto; }
  .phone-nav-bar { width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .phone-nav-bar::after { content: ''; width: 134px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .app-header { height: 56px; background: #FFF8F4; display: flex; align-items: center; padding: 0 12px; }
  .app-header .back { font-size: 20px; color: #1C1B1F; cursor: pointer; border: none; background: none; width: 40px; text-decoration: none; display: flex; align-items: center; justify-content: center; }
  .app-header .title { font-size: 20px; font-weight: 300; letter-spacing: 2px; color: #1C1B1F; }
  .section-title { padding: 16px 18px 6px; font-size: 12px; font-weight: 500; color: #49454F; text-transform: uppercase; letter-spacing: 1px; }
  .setting-row { margin: 0 16px 1px; padding: 14px 16px; background: #fff; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #F3EDF7; }
  .setting-row.first { border-radius: 4px 4px 0 0; }
  .setting-row.last { border-radius: 0 0 4px 4px; margin-bottom: 8px; }
  .setting-row .label { font-size: 15px; color: #1C1B1F; }
  .setting-row .value { font-size: 14px; color: #49454F; }
  .setting-row .arrow { font-size: 14px; color: #C25A00; }
  .setting-row a { text-decoration: none; color: inherit; display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .toggle { width: 44px; height: 24px; background: #E7E0EC; border-radius: 12px; position: relative; cursor: pointer; flex-shrink: 0; }
  .toggle.on { background: #C25A00; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left 0.2s; }
  .toggle.on::after { left: 22px; }
  .back-link { display: block; text-align: center; padding: 20px 16px; font-size: 12px; color: #999; text-decoration: none; }
</style></head>
<body>
<div class="phone-frame">
  <div class="phone-status-bar"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>
  <div class="phone-screen">
    <div class="app-header"><a class="back" href="index.html">←</a><span class="title">系统设置</span></div>

    <div class="section-title">监测</div>

    <div class="setting-row first">
      <span class="label">定位监测</span>
      <span class="toggle on" id="locationToggle" onclick="this.classList.toggle('on')"></span>
    </div>
    <div class="setting-row last">
      <span class="label">运动监测</span>
      <span class="toggle" id="motionToggle" onclick="this.classList.toggle('on')"></span>
    </div>

    <div class="section-title">告警</div>

    <a href="守护时段配置.html">
      <div class="setting-row first">
        <span class="label">守护时段</span>
        <span class="value">2个时段, 共9小时</span>
        <span class="arrow">›</span>
      </div>
    </a>
    <a href="守护时段配置.html">
      <div class="setting-row last">
        <span class="label">静置告警阈值</span>
        <span class="value">30分钟</span>
        <span class="arrow">›</span>
      </div>
    </a>

    <div class="section-title">关于</div>

    <div class="setting-row first">
      <span class="label">版本号</span>
      <span class="value">V1.1.0</span>
    </div>
    <div class="setting-row">
      <span class="label">隐私条款</span>
      <span class="arrow">›</span>
    </div>
    <div class="setting-row last">
      <span class="label">通用</span>
      <span class="arrow">›</span>
    </div>

    <a class="back-link" href="index.html">← 返回场景地图</a>
  </div>
  <div class="phone-nav-bar"></div>
</div>
</body>
</html>
