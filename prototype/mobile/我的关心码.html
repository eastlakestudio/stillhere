<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的关心码 - 晴好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 40px 0; background: linear-gradient(135deg, #e8eaed 0%, #d5d8dc 100%); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 390px; background: #1a1a1a; border: 3px solid #333; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 0 10px rgba(255,255,255,0.05); padding: 10px 7px; }
  .phone-status-bar { width: 375px; height: 24px; margin: 0 auto; background: #000; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
  .phone-status-bar .time { color: #fff; font-size: 12px; font-weight: 500; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; align-items: center; }
  .phone-status-bar::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; }
  .phone-screen { width: 375px; height: 780px; margin: 0 auto; background: #FFF8F4; border-radius: 0 0 28px 28px; overflow-y: auto; overflow-x: hidden; }
  .phone-nav-bar { width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .phone-nav-bar::after { content: ''; width: 134px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .app-header { height: 56px; background: #FFF8F4; display: flex; align-items: center; padding: 0 12px; position: sticky; top: 0; z-index: 10; }
  .app-header .back { font-size: 20px; color: #1C1B1F; cursor: pointer; border: none; background: none; width: 40px; text-align: center; }
  .app-header .title { font-size: 20px; font-weight: 300; letter-spacing: 2px; color: #1C1B1F; }
  .content { padding: 0 16px; }
  .qr-box { width: 200px; height: 200px; margin: 40px auto 24px; background: #fff; border: 2px solid #E7E0EC; display: flex; align-items: center; justify-content: center; color: #C25A00; font-size: 14px; }
  .code-display { text-align: center; font-size: 32px; font-weight: 300; color: #1C1B1F; letter-spacing: 8px; font-family: 'Courier New', monospace; margin-bottom: 28px; }
  .btn { display: block; width: 100%; padding: 14px 0; background: #C25A00; border: none; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; margin-bottom: 20px; }
  .divider { border-top: 1px solid #E7E0EC; margin: 0 -16px; }
  .hint { padding: 16px; font-size: 13px; color: #49454F; line-height: 1.6; }
  .info-card { margin: 12px 16px; background: #F3EDF7; padding: 16px; display: flex; gap: 32px; }
  .info-card .label { font-size: 12px; color: #49454F; }
  .info-card .value { font-size: 16px; color: #1C1B1F; margin-top: 2px; font-weight: 500; }
  .back-link { display: block; text-align: center; padding: 20px 16px; font-size: 12px; color: #999; text-decoration: none; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-status-bar"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>
  <div class="phone-screen">
    <div class="app-header">
      <button class="back" onclick="location.href='index.html'">←</button>
      <span class="title">我的关心码</span>
    </div>
    <div class="content">
      <div class="qr-box">QR Code<br>200×200</div>
      <div class="code-display">A1B2C3</div>
      <button class="btn" onclick="alert('分享关心码')">分享关心码</button>
    </div>
    <div class="divider"></div>
    <div class="hint">将此页面展示给对方，对方扫码或输入以上 6 位码即可添加你为关心对象。</div>
    <div class="divider"></div>
    <div class="info-card">
      <div><div class="label">绑定时间</div><div class="value">2026-07-20</div></div>
      <div><div class="label">关心我的人</div><div class="value">3 人</div></div>
    </div>
    <a class="back-link" href="index.html">← 返回场景地图</a>
  </div>
  <div class="phone-nav-bar"></div>
</div>
</body>
</html>
