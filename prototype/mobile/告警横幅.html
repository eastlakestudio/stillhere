<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>告警横幅 - 晴好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 40px 0; background: linear-gradient(135deg, #e8eaed 0%, #d5d8dc 100%); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .phone-frame { width: 390px; background: #1a1a1a; border: 3px solid #333; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 10px 7px; }
  .phone-status-bar { width: 375px; height: 24px; margin: 0 auto; background: #000; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
  .phone-status-bar .time { color: #fff; font-size: 12px; margin-left: 16px; }
  .phone-status-bar .icons { color: #fff; font-size: 10px; display: flex; gap: 6px; }
  .phone-status-bar::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; }
  .phone-screen { width: 375px; height: 780px; margin: 0 auto; background: #FFF8F4; border-radius: 0 0 28px 28px; overflow-y: auto; }
  .phone-nav-bar { width: 375px; height: 8px; margin: 0 auto; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .phone-nav-bar::after { content: ''; width: 134px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
  .app-header { height: 56px; background: #FFF8F4; display: flex; align-items: center; justify-content: center; }
  .app-header .title { font-size: 20px; font-weight: 300; letter-spacing: 3px; color: #1C1B1F; }
  .alert-banner { margin: 8px 16px; padding: 14px 16px; background: #FFEBEE; border: 1px solid #B3261E; display: flex; align-items: center; justify-content: space-between; }
  .alert-banner .text { font-size: 14px; color: #B3261E; font-weight: 500; }
  .alert-banner .cd { font-size: 13px; color: #B3261E; opacity: 0.7; margin-left: 8px; }
  .alert-banner button { padding: 6px 14px; background: none; border: 1px solid #B3261E; color: #B3261E; font-size: 13px; cursor: pointer; }
  .card { margin: 10px 16px; background: #F3EDF7; padding: 16px; }
  .card .label { font-size: 12px; color: #49454F; }
  .card .value { font-size: 16px; color: #1C1B1F; margin-top: 2px; font-weight: 500; }
  .section-title { padding: 16px 16px 8px; font-size: 14px; font-weight: 500; color: #49454F; }
  .btn { display: block; width: calc(100% - 32px); margin: 8px 16px; padding: 14px 0; background: #C25A00; border: none; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; }
  .back-link { display: block; text-align: center; padding: 20px 16px; font-size: 12px; color: #999; text-decoration: none; }
</style></head>
<body>
<div class="phone-frame">
  <div class="phone-status-bar"><span class="time">9:41</span><span class="icons">📶 🔋</span></div>
  <div class="phone-screen">
    <div class="app-header"><span class="title">晴好</span></div>
    <div class="alert-banner" id="banner"><div><span class="text">🚨 已 30 分钟无活动</span><span class="cd" id="cd">4:32 后通知关心人</span></div><button onclick="this.parentElement.style.display='none'">取消</button></div>
    <div class="card"><div class="label">空闲时长</div><div class="value">30 分钟</div></div>
    <div class="card"><div class="label">告警阈值</div><div class="value">30 分钟</div></div>
    <div class="card"><div class="label">取消窗口</div><div class="value">5 分钟内点击「取消」可撤销</div></div>
    <div class="card"><div class="label">超时后</div><div class="value">通知所有关心人</div></div>
    <div class="section-title">演示控制</div>
    <button class="btn" onclick="document.getElementById('banner').style.display='flex';document.getElementById('cd').textContent='4:32 后通知关心人'">触发告警</button>
    <a class="back-link" href="index.html">← 返回场景地图</a>
  </div>
  <div class="phone-nav-bar"></div>
</div>
</body>
</html>
